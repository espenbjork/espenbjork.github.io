<!DOCTYPE html>
<!--
  Felleskortet bodde her før. Appen har fått sitt eget repo,
  espenbjork/felleskortet, som publiserer felleskortet.no.

  Denne sida står igjen bare for å holde gamle lenker i live. Viktigst er
  delingslenkene: et helt oppgjør ligger i #-delen av adressen, så den må
  følge med videre. Derfor gjøres videresendinga i JavaScript og ikke med
  «meta refresh», som ville mistet den. Appen krever uansett JavaScript,
  og uten det står lenka synlig på sida.
-->
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Felleskortet har flyttet</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://felleskortet.no/">
  <style>
    body {
      margin: 0; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      line-height: 1.55; color: #16302a; background: #e6e9df;
    }
    main { max-width: 32rem; padding: 2rem; text-align: center; }
    h1 { font-family: Iowan Old Style, Baskerville, Georgia, serif; font-weight: 400; }
    a { color: #0d3527; }
  </style>
</head>
<body>
  <main>
    <h1>Felleskortet har flyttet</h1>
    <p>Appen ligger nå på <a id="lenke" href="https://felleskortet.no/">felleskortet.no</a>.</p>
    <p>Du sendes dit automatisk. Delingslenker virker som før.</p>
  </main>
  <script>
    // Et delt oppgjør ligger i #-delen. Den skal med videre, ellers mister
    // mottakeren hele fordelingen.
    var mål = 'https://felleskortet.no/' + (location.hash || '');
    document.getElementById('lenke').href = mål;
    location.replace(mål);
  </script>
</body>
</html>
