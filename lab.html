<!DOCTYPE html>
<html lang="no" class="js" data-motion="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light">
  <title>Bindersen, kikkehullet</title>
  <link rel="stylesheet" href="assets/css/styles.css?v=dev">
  <style>
    /* Kikkehullet er et verktøy, ikke en side. Det låner tegningen og fargene fra styles.css og tar ingenting annet. */
    .lab{ max-width:var(--maxw); margin:0 auto; padding:2.5rem var(--gutter) 4rem; }
    .lab h1{ font-size:1.6rem; font-weight:600; margin:0 0 .4rem; }
    .lab__lede{ color:var(--ink-2); max-width:44ch; margin:0 0 2rem; }
    .lab__grid{ display:grid; grid-template-columns:minmax(0, 20rem) minmax(0, 1fr); gap:3rem; align-items:start; }
    .lab__buttons{ display:flex; flex-wrap:wrap; gap:.5rem; }
    .lab__buttons button{
      font:inherit; font-size:.95rem; color:var(--ink); background:var(--paper-2);
      border:1px solid var(--line-2); border-radius:999px; padding:.35rem .9rem; cursor:pointer;
    }
    .lab__buttons button:hover{ border-color:var(--ink); }
    .lab__buttons button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
    .lab__buttons button[data-stop]{ background:var(--ink); color:var(--accent-ink); border-color:var(--ink); }
    .lab__opts{ display:flex; flex-wrap:wrap; gap:1rem; margin:1.6rem 0 0; font-size:.9rem; color:var(--ink-2); }
    .lab__opts label{ display:flex; align-items:center; gap:.4rem; }
    .lab__opts select, .lab__opts input{ font:inherit; font-size:.9rem; color:var(--ink); background:var(--paper-2); border:1px solid var(--line-2); border-radius:6px; padding:.2rem .4rem; }
    .lab__opts input{ width:5rem; }
    .lab__log{ margin:1.6rem 0 0; font-size:.85rem; color:var(--ink-2); min-height:1.3em; font-variant-numeric:tabular-nums; }

    /* Scenen: figuren i samme størrelse som i toppen, ellers i ro */
    .lab__stage{ position:relative; min-height:30rem; }
    .lab__stage .clippy{ position:absolute; top:6rem; right:4rem; transform:none; }
    .lab__mal{
      position:absolute; padding:.3rem .7rem; border:1px dashed var(--line-2); border-radius:6px;
      font-size:.85rem; color:var(--ink-2); background:var(--paper-2);
    }
    .lab__mal--venstre{ left:0; top:24rem; }
    .lab__mal--under{ right:5rem; top:29rem; }
    .lab__mal--hoyre{ right:-1rem; top:18rem; }
    @media (max-width:880px){
      .lab__grid{ grid-template-columns:minmax(0, 1fr); gap:2rem; }
      .lab__stage .clippy{ position:absolute; width:170px; right:1rem; margin:0; }
      .lab__stage .clippy__char{ width:100%; }
      .lab__mal--hoyre{ right:0; }
    }
  </style>
</head>
<body>
  <main class="lab">
    <h1>Bindersen, kikkehullet</h1>
    <p class="lab__lede">Lokal. En knapp per emote, og en stopp som sender henne hjem. Siden er ikke lenket fra nettstedet.</p>

    <div class="lab__grid">
      <div>
        <div class="lab__buttons" id="lab-knapper"></div>
        <div class="lab__opts">
          <label>mål for pek
            <select id="lab-mal">
              <option value="venstre">venstre</option>
              <option value="under">under</option>
              <option value="hoyre">høyre</option>
            </select>
          </label>
          <label>hold (ms)
            <input id="lab-hold" type="number" min="200" max="6000" step="100" placeholder="standard">
          </label>
        </div>
        <p class="lab__log" id="lab-logg" aria-live="polite"></p>
      </div>

      <div class="lab__stage">
        <div class="clippy" data-open="false">
          <button class="clippy__char" type="button" data-bindersen="hero" aria-label="Bindersen">
            <svg class="clippy__svg" viewBox="0 0 220 320" fill="none" aria-hidden="true" focusable="false">
              <path class="clippy__wire" d="M138 86 C138 55 78 55 78 86 L78 250 C78 285 150 285 150 250 L150 120 C150 92 100 92 100 120 L100 232" />
              <g class="clippy__face">
                <g class="clippy__eyes">
                  <ellipse class="clippy__eye" cx="96" cy="110" rx="16" ry="20" />
                  <ellipse class="clippy__eye" cx="140" cy="110" rx="16" ry="20" />
                  <circle class="clippy__pupil" cx="99" cy="114" r="6.5" />
                  <circle class="clippy__pupil" cx="143" cy="114" r="6.5" />
                </g>
                <path class="clippy__brow clippy__brow--l" d="M80 82 Q96 73 113 80" />
                <path class="clippy__brow clippy__brow--r" d="M125 80 Q142 73 158 82" />
              </g>
            </svg>
          </button>
        </div>
        <span class="lab__mal lab__mal--venstre" id="mal-venstre">mål, venstre</span>
        <span class="lab__mal lab__mal--under" id="mal-under">mål, under</span>
        <span class="lab__mal lab__mal--hoyre" id="mal-hoyre">mål, høyre</span>
      </div>
    </div>
  </main>

  <script src="assets/js/bindersen.js?v=dev" defer></script>
  <script>
    /* Starter tegningen som main.js gjør på forsiden, og bygger knappene når bindersen.js er lastet */
    requestAnimationFrame(() => document.body.classList.add("is-ready"));
    window.addEventListener("load", () => {
      const box = document.getElementById("lab-knapper");
      const logg = document.getElementById("lab-logg");
      const api = window.bindersen;
      if (!api) {
        logg.textContent = "window.bindersen finnes ikke. Redusert bevegelse er på, eller data-motion er av.";
        return;
      }
      const add = (text, onClick, extra) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = text;
        if (extra) b.setAttribute(extra, "");
        b.addEventListener("click", onClick);
        box.append(b);
      };
      api.emotes.forEach((navn) => add(navn, () => {
        const valg = {};
        const hold = parseInt(document.getElementById("lab-hold").value, 10);
        if (hold) valg.hold = hold;
        if (navn === "pek") valg.mot = document.getElementById("mal-" + document.getElementById("lab-mal").value);
        const t0 = performance.now();
        logg.textContent = navn + " spiller";
        api.play(navn, valg).then(() => {
          logg.textContent = navn + " ferdig etter " + Math.round(performance.now() - t0) + " ms";
        });
      }));
      add("stopp", () => { api.stop(); logg.textContent = "stopp"; }, "data-stop");
    });
  </script>
</body>
</html>
